<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — TechStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Cuenta.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">TechStore</a>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="#">Servicios</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="auth-container">

    <a href="index.html" class="auth-logo">TechStore</a>
    <h2>Crear cuenta</h2>
    <p class="auth-subtitle">Regístrate gratis y empieza a comprar</p>

    <div class="mensaje" id="mensaje" style="display:none;"></div>

    <form class="auth-form" id="registerForm">

      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Juan Pérez" required autocomplete="name">
        <span class="field-error" id="err-nombre"></span>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"
               placeholder="tu@correo.com" required autocomplete="email">
        <span class="field-error" id="err-email"></span>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('password', this)">
            Ver
          </button>
        </div>
        <span class="field-error" id="err-password"></span>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <div class="input-wrap">
          <input type="password" id="confirm" name="confirm"
                 placeholder="Repite tu contraseña" required>
          <button type="button" class="toggle-pw" onclick="togglePw('confirm', this)">
            Ver
          </button>
        </div>
        <span class="field-error" id="err-confirm"></span>
      </div>

      <!-- Barra de fortaleza de contraseña -->
      <div class="pw-strength-wrap" id="pw-strength-wrap" style="display:none;">
        <div class="pw-strength-bar">
          <div class="pw-strength-fill" id="pw-fill"></div>
        </div>
        <span class="pw-strength-label" id="pw-label"></span>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        Crear cuenta
      </button>

    </form>

    <div class="divider"><span>o</span></div>

    <button type="button" class="btn-google" id="btnGoogleRegister">
      Crear cuenta con Google
    </button>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
    </p>

  </div>
</main>

<footer>
  <p>&copy; 2026 TechStore — Todos los derechos reservados</p>
</footer>

<script>
  const GOOGLE_SIGNIN_URL = 'https://accounts.google.com/v3/signin/identifier?authuser=0&continue=https%3A%2F%2Fwww.google.com%2Fsearch%3Fq%3Dgoogle%26oq%3Dgoogle%26gs_lcrp%3DEgZjaHJvbWUyBggAEEUYOTIGCAEQRRg8MgYIAhBFGDwyBggDEEUYPDIGCAQQLhhA0gEJMTMyOTJqMGo3qAIAsAIA%26sourceid%3Dchrome%26ie%3DUTF-8&ec=futura_srp_og_si_72236_p&hl=es-419&flowName=GlifWebSignIn&flowEntry=AddSession&dsh=S-29846599%3A1777244349747408';

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Ocultar';
    } else {
      input.type = 'password';
      btn.textContent = 'Ver';
    }
  }

  function mostrarMensaje(texto, tipo) {
    const el = document.getElementById('mensaje');
    el.textContent = texto;
    el.className = 'mensaje ' + tipo;
    el.style.display = 'block';
  }

  function registrarConGoogle() {
    localStorage.setItem('googleAuthPendiente', '1');
    window.location.href = GOOGLE_SIGNIN_URL;
  }

  function completarRegistroConGoogle() {
    const email = prompt('Ingresa tu correo de Google:');
    if (!email) return;
    const emailLimpio = email.trim().toLowerCase();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(emailLimpio) || !emailLimpio.endsWith('@gmail.com')) {
      mostrarMensaje('Debes ingresar un correo valido de Google (@gmail.com).', 'error');
      return;
    }

    const nombre = prompt('Ingresa tu nombre completo:');
    if (!nombre || nombre.trim().length < 2) {
      mostrarMensaje('Ingresa un nombre valido para crear tu cuenta.', 'error');
      return;
    }

    try {
      const cuentas = JSON.parse(localStorage.getItem('cuentasTechStore') || '[]');
      const existeCuenta = cuentas.some(cuenta => cuenta.email.toLowerCase() === emailLimpio);
      if (existeCuenta) {
        mostrarMensaje('Ese correo ya existe. Te llevamos a iniciar sesion.', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1400);
        return;
      }

      const nuevaCuenta = {
        nombre: nombre.trim(),
        email: emailLimpio,
        password: null,
        proveedor: 'google'
      };
      cuentas.push(nuevaCuenta);
      localStorage.setItem('cuentasTechStore', JSON.stringify(cuentas));
      localStorage.setItem('usuario', nuevaCuenta.nombre);
      localStorage.setItem('usuarioEmail', nuevaCuenta.email);
      localStorage.removeItem('googleAuthPendiente');
      mostrarMensaje('Cuenta de Google creada con exito. Redirigiendo...', 'exito');
      setTimeout(() => { window.location.href = 'index.html'; }, 1400);
    } catch (err) {
      mostrarMensaje('No se pudo crear la cuenta con Google.', 'error');
    }
  }

  function intentarCompletarRegistroGooglePendiente() {
    if (localStorage.getItem('googleAuthPendiente') !== '1') return;
    const params = new URLSearchParams(window.location.search);
    // Si llegaste aqui desde un flujo de compra/login, no molestamos con Google.
    if (params.has('redirect')) {
      localStorage.removeItem('googleAuthPendiente');
      return;
    }
    const confirmar = confirm('Si ya completaste Google, presiona Aceptar para guardar tu perfil en TechStore.');
    if (!confirmar) return;
    completarRegistroConGoogle();
  }

  // Barra fortaleza contraseña
  document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const wrap = document.getElementById('pw-strength-wrap');
    const fill = document.getElementById('pw-fill');
    const label= document.getElementById('pw-label');

    if (!val) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'flex';

    let score = 0;
    if (val.length >= 8)         score++;
    if (/[A-Z]/.test(val))       score++;
    if (/[0-9]/.test(val))       score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const niveles = ['Muy débil','Débil','Moderada','Fuerte'];
    const colores = ['#e53e3e','#dd6b20','#d69e2e','#38a169'];
    fill.style.width  = (score * 25) + '%';
    fill.style.background = colores[score - 1] || '#e53e3e';
    label.textContent = niveles[score - 1] || 'Muy débil';
    label.style.color = colores[score - 1] || '#e53e3e';
  });

  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // Limpiar errores previos
    document.querySelectorAll('.field-error').forEach(el => {
      el.style.display = 'none'; el.textContent = '';
    });

    const nombre   = document.getElementById('nombre').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    // Validaciones del lado cliente
    let errores = false;

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (nombre.length < 2) {
      document.getElementById('err-nombre').textContent = 'Ingresa tu nombre completo.';
      document.getElementById('err-nombre').style.display = 'block';
      errores = true;
    }
    if (!emailRegex.test(email)) {
      document.getElementById('err-email').textContent = 'Ingresa un correo valido.';
      document.getElementById('err-email').style.display = 'block';
      errores = true;
    }
    if (password.length < 8) {
      document.getElementById('err-password').textContent = 'La contraseña debe tener al menos 8 caracteres.';
      document.getElementById('err-password').style.display = 'block';
      errores = true;
    }
    if (password !== confirm) {
      document.getElementById('err-confirm').textContent = 'Las contraseñas no coinciden.';
      document.getElementById('err-confirm').style.display = 'block';
      errores = true;
    }
    if (errores) return;

    const btn = document.getElementById('btn-submit');
    btn.textContent = 'Creando cuenta...';
    btn.disabled = true;

    try {
      const cuentas = JSON.parse(localStorage.getItem('cuentasTechStore') || '[]');
      const existeCuenta = cuentas.some(cuenta => cuenta.email.toLowerCase() === email.toLowerCase());

      if (existeCuenta) {
        mostrarMensaje('Ese correo ya esta registrado. Inicia sesion.', 'error');
        btn.textContent = 'Crear cuenta';
        btn.disabled = false;
        return;
      }

      const nuevaCuenta = {
        nombre,
        email,
        password
      };

      cuentas.push(nuevaCuenta);
      localStorage.setItem('cuentasTechStore', JSON.stringify(cuentas));

      mostrarMensaje('Cuenta creada con exito. Redirigiendo al inicio de sesion...', 'exito');
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      mostrarMensaje('No se pudo guardar la cuenta en este navegador.', 'error');
      btn.textContent = 'Crear cuenta';
      btn.disabled = false;
    }
  });

  document.getElementById('btnGoogleRegister').addEventListener('click', registrarConGoogle);
  intentarCompletarRegistroGooglePendiente();
</script>

</body>
</html>
